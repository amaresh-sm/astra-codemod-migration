scale: normalized_1
# The verifier scores Rust migration, not merely compatibility. A retained
# JavaScript engine is reported as compatibility evidence but is capped at
# 0.0400. Behavior earns migration credit only through its matching Rust
# ownership domain. A validated Rust foundation also carries a small,
# separately evidenced migration-progress allowance.
