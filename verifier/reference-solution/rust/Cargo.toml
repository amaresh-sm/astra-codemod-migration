[package]
name = "jscodeshift"
version = "17.4.0"
edition = "2021"

[[bin]]
name = "jscodeshift"
path = "src/main.rs"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
