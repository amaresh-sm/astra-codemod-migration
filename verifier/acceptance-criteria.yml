task_id: migrate-jscodeshift-runner-to-rust
criteria:
  - id: cli-transform-api
    requirement: The migrated CLI loads JavaScript and TypeScript transforms, including Babel-transpiled default exports, and preserves the jscodeshift transform API aliases.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.cli-transform-api
    mutant: transform-api-drift
    weight: 0.0176470588
  - id: parser-and-transform-variants
    requirement: TSX, Flow, transform-declared parsers, asynchronous transforms, and URL-sourced transforms remain compatible.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.parser-and-transform-variants
    mutant: parser-source-drift
    weight: 0.0147058824
  - id: file-selection-and-stdin
    requirement: Recursive paths, extension filters, ignore patterns, and newline-separated stdin paths select the intended files.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.file-selection-and-stdin
    mutant: selection-filter-drift
    weight: 0.0205882353
  - id: dry-run-print-and-reporting
    requirement: Dry runs preserve files while print output, statistics, and transform reports remain observable.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.dry-run-print-and-reporting
    mutant: dry-run-write-leak
    weight: 0.0176470588
  - id: parallel-workers-and-results
    requirement: The runner honors a CPU limit, processes every selected file, and reports aggregate worker results.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.parallel-workers-and-results
    mutant: worker-count-drift
    weight: 0.0205882353
  - id: failure-and-exit-contract
    requirement: Transform failures are reported per file and --fail-on-error controls the process exit status.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.failure-and-exit-contract
    mutant: fail-on-error-drift
    weight: 0.0176470588

  - id: cli-surface-and-identity
    requirement: Help and version output expose the supported CLI surface and identify the Rust runner.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.cli-surface-and-identity
    mutant: cli-surface-drift
    weight: 0.0117647059

  - id: silent-output-contract
    requirement: --silent suppresses all CLI output without suppressing file transformation.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.silent-output-contract
    mutant: silent-output-drift
    weight: 0.0176470588

  - id: symlink-boundary
    requirement: File discovery preserves the legacy runner's processing behavior for in-root and out-of-root symlinks.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.symlink-boundary
    mutant: symlink-boundary-drift
    weight: 0.0205882353

  - id: parallel-failure-recovery
    requirement: A worker failure is reported without preventing independent files from completing.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.parallel-failure-recovery
    mutant: worker-failure-isolation-drift
    weight: 0.0176470588

  - id: lifecycle-manifest
    requirement: The candidate declares valid build, reset, and start lifecycle commands.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.lifecycle-manifest
    mutant: lifecycle-manifest-drift
    weight: 0.0147058824
  - id: custom-option-forwarding
    requirement: Repeatable and equals-form custom options reach JavaScript transforms without losing values.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.custom-option-forwarding
    mutant: custom-option-forwarding-drift
    weight: 0.0176470588
  - id: atomic-write-on-error
    requirement: A transform error never partially overwrites the input file.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.atomic-write-on-error
    mutant: partial-write-on-error
    weight: 0.0176470588
  - id: parallel-result-determinism
    requirement: Repeated parallel runs preserve stable aggregate status reporting.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.parallel-result-determinism
    mutant: nondeterministic-worker-report
    weight: 0.0176470588
  - id: utf8-source-preservation
    requirement: No-op transforms preserve UTF-8 source content and non-ASCII characters.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.utf8-source-preservation
    mutant: encoding-preservation-drift
    weight: 0.0176470588
  - id: ast-collections-and-builders
    requirement: Transforms can traverse collections and use standard jscodeshift builders before printing.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.ast-collections-and-builders
    mutant: ast-builder-drift
    weight: 0.0176470588
  - id: ast-formatting-and-comments
    requirement: AST edits preserve leading comments and honor source formatting options.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.ast-formatting-and-comments
    mutant: ast-formatting-drift
    weight: 0.0176470588
  - id: ast-modern-syntax
    requirement: TypeScript, TSX, and modern JavaScript syntax remain traversable by AST transforms.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.ast-modern-syntax
    mutant: ast-syntax-drift
    weight: 0.0176470588

  - id: core-api-surface
    requirement: The package core export preserves parser binding, matching, plugin registration, builders, enriched API helpers, and its documented string, node, node-path, and array input forms.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.core-api-surface
    mutant: core-api-surface-drift
    weight: 0.0235294118

  - id: collection-extensions
    requirement: Typed collections preserve import, variable, JSX, filter, mapping, mutation, predicate, indexing, and NodePath accessors.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.collection-extensions
    mutant: collection-extension-drift
    weight: 0.0235294118

  - id: template-code-generation
    requirement: Statement, expression, and async-expression template helpers produce compatible AST nodes, array interpolations, and printed code.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.template-code-generation
    mutant: template-generation-drift
    weight: 0.0235294118

  - id: package-root-export
    requirement: The package root remains importable and exports the callable jscodeshift API with its standard helpers.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.package-root-export
    mutant: package-export-drift
    weight: 0.0235294118

  - id: rust-runner-entrypoint
    requirement: The public jscodeshift launcher executes the compiled Rust runner.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.rust-runner-entrypoint
    mutant: javascript-runner-fallback
    weight: 0.0088235294
  - id: rust-parser-printer-ownership
    requirement: Source parsing and printing execute without loading retained first-party JavaScript parser adapters or JavaScript parser/printer dependencies.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.rust-parser-printer-ownership
    mutant: retained-javascript-parser-printer-delegation
    weight: 0.15
  - id: rust-core-collections-ownership
    requirement: The transform core API, collection traversal, matching, and templates execute without loading their retained first-party JavaScript implementation.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.rust-core-collections-ownership
    mutant: retained-javascript-core-collections-delegation
    weight: 0.15
  - id: rust-worker-execution-ownership
    requirement: The public CLI executes transforms without loading the retained JavaScript runner or worker implementation.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.rust-worker-execution-ownership
    mutant: retained-javascript-worker-delegation
    weight: 0.10
  - id: rust-package-api-ownership
    requirement: Direct package-root helpers execute without loading retained first-party JavaScript parser, core, collection, or template code.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.rust-package-api-ownership
    mutant: retained-javascript-package-api-delegation
    weight: 0.10

  - id: cross-feature-compatibility
    requirement: CLI options, parser selection, worker scheduling, templates, and ignore rules compose correctly in a single run.
    hidden_test: jscodeshift.cross-feature-compatibility
    mutant: cross-feature-composition-drift
    weight: 0.0311764706
  - id: package-boundary-compatibility
    requirement: The packed npm artifact retains its public metadata, package export, and CLI entrypoint.
    hidden_test: jscodeshift.package-boundary-compatibility
    mutant: package-boundary-drift
    weight: 0.01
  - id: ast-composition-corpus
    requirement: A multi-file TypeScript/TSX AST corpus preserves syntax, plugins, collections, templates, and formatting.
    hidden_test: jscodeshift.ast-composition-corpus
    mutant: ast-corpus-drift
    weight: 0.0176470588
  - id: worker-replay-consistency
    requirement: Delayed and failed transforms produce the same successful and failed file outcomes in parallel and serial modes.
    hidden_test: jscodeshift.worker-replay-consistency
    mutant: worker-replay-drift
    weight: 0.0235294118
