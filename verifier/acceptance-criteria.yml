task_id: migrate-jscodeshift-runner-to-rust
criteria:
  - id: cli-transform-api
    requirement: JavaScript and TypeScript transforms, default exports, API aliases, and options remain compatible.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.cli-transform-api
    mutant: transform-api-drift
    weight: 0.0075
  - id: parser-and-transform-variants
    requirement: TSX, Flow, transform-declared parsers, async transforms, and URL transforms remain compatible.
    contract: public/contracts/migration.contract.json
    hidden_test: jscodeshift.parser-and-transform-variants
    mutant: parser-source-drift
    weight: 0.0075
  - id: file-selection-and-stdin
    requirement: Recursive discovery, extensions, ignores, and newline-separated stdin paths select intended files.
